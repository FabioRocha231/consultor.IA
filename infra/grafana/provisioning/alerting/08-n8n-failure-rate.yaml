apiVersion: 1

groups:
  - orgId: 1
    name: n8n-failure-rate
    folder: consultor-ia
    interval: 1m
    rules:
      - uid: n8n-failure-rate
        title: n8n integration failure rate > 25% (5m)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(n8n_failures_total[5m])) / clamp_min(sum(rate(n8n_requests_total[5m])), 0.001) > 0.25
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: '__expr__'
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
          component: n8n
        annotations:
          summary: "n8n failure rate >25% (5m)"
          description: "Mais de 25% das chamadas n8n falharam nos últimos 5 minutos. Verifique conectividade com {{ $labels.instance }} e credentials."
          runbook_url: "https://github.com/FabioRocha231/consultor.IA/blob/master/docs/architecture/38-alerting-runbook.md"
