apiVersion: 1

groups:
  - orgId: 1
    name: consultor.IA Platform Health
    folder: consultor.IA / Alerts
    interval: 1m
    rules:
      - uid: consultor-ia-platform-core-down
        title: Core service unavailable
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: One or more core services are unavailable for 5 minutes.
          runbook_url: docs/architecture/38-alerting-runbook.md#platform-health
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: up == 0
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator: and
              settings:
                mode: threshold
                thresholds:
                  - color: red
                    value: 0
            relativeTimeRange:
              from: 0
              to: 0
