apiVersion: 1

groups:
  - orgId: 1
    name: consultor.IA Document Ingestion
    folder: consultor.IA / Alerts
    interval: 1m
    rules:
      - uid: consultor-ia-document-ingestion-failures
        title: Document ingestion failure burst
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 3 document ingestion failures in 5 minutes.
          runbook_url: docs/architecture/38-alerting-runbook.md#document-ingestion-failures
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(increase(document_ingestion_failures_total[5m])) > 3'
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator: and
              settings:
                mode: threshold
                thresholds:
                  - color: red
                    value: 0
            relativeTimeRange:
              from: 0
              to: 0
