apiVersion: 1

groups:
  - orgId: 1
    name: consultor.IA LLM Errors
    folder: consultor.IA / Alerts
    interval: 1m
    rules:
      - uid: consultor-ia-llm-error-rate
        title: LLM error rate above 5%
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LLM error rate is above 5% for 5 minutes.
          runbook_url: docs/architecture/38-alerting-runbook.md#llm-errors
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(rate(llm_errors_total[5m])) / clamp_min(sum(rate(llm_requests_total[5m])), 0.001) > 0.05'
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator: and
              settings:
                mode: threshold
                thresholds:
                  - color: red
                    value: 0
            relativeTimeRange:
              from: 0
              to: 0
