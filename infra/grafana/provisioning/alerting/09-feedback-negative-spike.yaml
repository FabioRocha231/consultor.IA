apiVersion: 1

groups:
  - orgId: 1
    name: feedback-negative-spike
    folder: consultor-ia
    interval: 1m
    rules:
      - uid: feedback-negative-spike
        title: feedback negative > 3 in 15m
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(feedback_negative_total[15m])) > 3
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: '__expr__'
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 0m
        labels:
          severity: warning
          component: feedback
        annotations:
          summary: "feedback negativo em alta ({{ $value }} thumbs-down nos últimos 15 min)"
          description: "Mais de 3 feedbacks negativos em 15 minutos. Verifique o que está acontecendo no RAG/agent."
          runbook_url: "https://github.com/FabioRocha231/consultor.IA/blob/master/docs/architecture/38-alerting-runbook.md"
