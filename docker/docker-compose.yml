name: anythingllm

# Compose stack for consultor.IA single deployment.
#
# Postgres is provided externally by Dokploy as a managed service (use the
# connection URL it gives you in DB_URL). Redis is not used in the pilot.
# Everything else below is part of this compose: the app, Qdrant (vector DB),
# and the observability stack (Alloy, Prometheus, Loki, Tempo, Grafana).
#
# To deploy on Dokploy:
#   1. Create the Postgres database in the Dokploy UI and copy the URL.
#   2. Point Dokploy at this repo / branch.
#   3. Set the env vars (DB_URL, JWT_SECRET, ADMIN_EMAIL/ADMIN_PASSWORD,
#      LLM_PROVIDER/LLM_PROVIDER_API_KEY) in the Dokploy service config.
#   4. Deploy. Grafana will be at :3000, app at :3001.

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm:
    container_name: anythingllm
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "../server/storage:/app/server/storage"
      - "../backups:/var/backups/consultor-ia"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    # Optional first-admin bootstrap. Set BOTH ADMIN_EMAIL and ADMIN_PASSWORD
    # in docker/.env before the first boot. The seed is idempotent and
    # ignores these values after an admin/manager already exists.
    environment:
      VECTOR_DB: ${VECTOR_DB:-qdrant}
      QDRANT_ENDPOINT: ${QDRANT_ENDPOINT:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-consultor-ia}
    networks:
      - anything-llm
    # service_started (not service_healthy): app boots as soon as
    # the qdrant container is created, not when its healthcheck passes.
    # Qdrant takes <1s to be ready for connections; the healthcheck above
    # is informational only. Decoupling prevents deploy failures when
    # the healthcheck flakes.
    depends_on:
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: consultor-qdrant
    restart: unless-stopped
    # Disable Qdrant telemetry for defense in depth (privacy gate also
    # blocks it at egress layer; this kills the call at source).
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - anything-llm
    # Robust healthcheck: uses the root endpoint (always 200 once qdrant is
    # listening), 127.0.0.1 to avoid DNS resolution issues, and start_period
    # to give qdrant 30s to fully initialize before failures count.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:6333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: consultor-alloy
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ../infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "4317:4317"   # OTLP gRPC (host reachable; useful for external OTLP clients)
      # 4318 (OTLP HTTP) is container-internal only -- the app reaches Alloy
      # via DNS name `alloy` on port 4318, no host mapping needed.
    networks:
      - anything-llm
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: consultor-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - anything-llm

  loki:
    image: grafana/loki:3.3.2
    container_name: consultor-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../infra/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - anything-llm

  tempo:
    image: grafana/tempo:2.6.0
    container_name: consultor-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # HTTP query (host reachable; useful for debugging)
      # 4318 (OTLP HTTP receiver) is container-internal only -- Alloy reaches
      # Tempo via DNS name `tempo` on port 4318, no host mapping needed.
    networks:
      - anything-llm

  grafana:
    image: grafana/grafana:11.5.2
    container_name: consultor-grafana
    restart: unless-stopped
    # Port 3030 on host to avoid conflict with Dokploy UI (which uses 3000).
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "true"
      GF_SMTP_ENABLED: ${SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-alerts@consultor.local}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-consultor.IA Alerts}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://localhost:65534}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@localhost}
    volumes:
      - ../infra/grafana/provisioning:/etc/grafana/provisioning
      - ../infra/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - anything-llm

volumes:
  grafana_data:
  qdrant_data:
  alloy_data:
  prometheus_data:
  loki_data:
  tempo_data:
