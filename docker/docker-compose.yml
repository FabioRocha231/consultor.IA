name: anythingllm

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm:
    container_name: anythingllm
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "../server/storage:/app/server/storage"
      - "../backups:/var/backups/consultor-ia"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    # Optional first-admin bootstrap. Set BOTH ADMIN_EMAIL and ADMIN_PASSWORD in
    # docker/.env before the first boot. The seed is idempotent and ignores
    # these values after an admin/manager already exists.
    networks:
      - anything-llm
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: consultor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: consultor
      POSTGRES_PASSWORD: consultor
      POSTGRES_DB: consultor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultor -d consultor"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: consultor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "true"
      GF_SMTP_ENABLED: ${SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-alerts@consultor.local}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-consultor.IA Alerts}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://localhost:65534}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@localhost}
    volumes:
      - "../infra/grafana/provisioning:/etc/grafana/provisioning"
      - grafana_data:/var/lib/grafana
    networks:
      - anything-llm

volumes:
  postgres_data:
  grafana_data:
