name: anythingllm

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm:
    container_name: anythingllm
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "../server/storage:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - anything-llm
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: consultor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: consultor
      POSTGRES_PASSWORD: consultor
      POSTGRES_DB: consultor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultor -d consultor"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: consultor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "../infra/grafana/provisioning:/etc/grafana/provisioning"
      - "../infra/grafana/dashboards:/etc/grafana/dashboards"
      - grafana_data:/var/lib/grafana
    networks:
      - anything-llm

volumes:
  postgres_data:
  grafana_data:
