name: consultor-ia

# consultor.IA for one company on a plain VPS (no Dokploy): app + Postgres +
# Qdrant + Caddy (automatic HTTPS). Managed by ./consultor.sh; see README.md.
# All settings come from ./.env, generated by `./consultor.sh install`.

services:
  app:
    image: ${CONSULTOR_IMAGE:-ghcr.io/fabiorocha231/consultor.ia:latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      # The app persists settings changed in the UI back to this file.
      - ./.env:/app/server/.env
      - app_storage:/app/server/storage
      - app_backups:/var/backups/consultor-ia
      - collector_hotdir:/app/collector/hotdir
      - collector_outputs:/app/collector/outputs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    # Major version must match pg_dump in the app image (16) for backups.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.7.4
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_storage:
  app_backups:
  collector_hotdir:
  collector_outputs:
  postgres_data:
  qdrant_data:
  caddy_data:
  caddy_config:
