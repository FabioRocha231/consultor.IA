name: Backup and restore drill

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: backup-restore-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: consultor
          POSTGRES_PASSWORD: consultor
          POSTGRES_DB: consultor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consultor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.7.4
        ports:
          - 6333:6333
    env:
      BACKUP_DIR: $RUNNER_TEMP/backup
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: consultor
      POSTGRES_USER: consultor
      POSTGRES_PASSWORD: consultor
      QDRANT_URL: http://localhost:6333
      STORAGE_DIR: $RUNNER_TEMP/storage
      DB_URL: postgresql://consultor:consultor@localhost:5432/consultor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache server dependencies
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('server/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-server-

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client jq shellcheck

      - name: Install server dependencies
        run: cd server && yarn install --frozen-lockfile

      - name: Run Prisma migrations
        run: cd server && npx prisma migrate deploy

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:6333/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1

      - name: Seed smoke data
        run: |
          mkdir -p "$STORAGE_DIR/documents"
          printf 'smoke document\n' > "$STORAGE_DIR/documents/smoke.txt"
          cd server
          node - <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const client = new Client({ connectionString: process.env.DB_URL });
            await client.connect();
            await client.query(`
              INSERT INTO organization (id, name, slug, status, "updatedAt")
              VALUES ('smoke-org', 'Smoke Org', 'smoke-org', 'active', now());
              INSERT INTO workspaces (id, name, slug, "organizationId")
              VALUES (1, 'Smoke Workspace', 'smoke-workspace', 'smoke-org');
              INSERT INTO workspace_chats (id, "workspaceId", prompt, response, include)
              VALUES (1, 1, 'ping', 'pong', true);
              INSERT INTO workspace_documents (id, "docId", filename, docpath, "workspaceId")
              VALUES (1, 'doc-smoke', 'smoke.txt', 'documents/smoke.txt', 1);
              UPDATE workspace_chats
              SET "feedbackScore" = true,
                  "feedbackCategory" = 'positive',
                  "feedbackComment" = 'restore drill',
                  "feedbackAt" = now()
              WHERE id = 1;
            `);
            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          curl -fsS -X PUT \
            http://localhost:6333/collections/smoke_collection \
            -H 'Content-Type: application/json' \
            -d '{"vectors":{"size":4,"distance":"Dot"}}' >/dev/null
          curl -fsS -X PUT \
            http://localhost:6333/collections/smoke_collection/points?wait=true \
            -H 'Content-Type: application/json' \
            -d '{"points":[{"id":1,"vector":[0.1,0.2,0.3,0.4],"payload":{"source":"smoke"}}]}' >/dev/null

      - name: Run backup
        run: bash docker/scripts/backup.sh

      - name: Restart Postgres and Qdrant to simulate outage
        run: |
          docker restart "${{ job.services.postgres.id }}" "${{ job.services.qdrant.id }}"

      - name: Wait for services after restart
        run: |
          for i in $(seq 1 60); do
            docker exec "${{ job.services.postgres.id }}" pg_isready -U consultor -d consultor >/dev/null 2>&1 || { sleep 1; continue; }
            curl -fsS http://localhost:6333/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1

      - name: Run restore drill
        run: |
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -name 'consultor-ia-*.tar.gz' -print -quit)"
          test -n "$BACKUP_FILE"
          RESTORE_CONFIRM=I_UNDERSTAND_THIS_WILL_OVERWRITE \
            bash docker/scripts/restore.sh --yes "$BACKUP_FILE"

      - name: Verify restored smoke data and write report
        run: |
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -name 'consultor-ia-*.tar.gz' -print -quit)"
          POSTGRES_COUNTS="$(docker exec "${{ job.services.postgres.id }}" psql -U consultor -d consultor -At -F, \
            -c 'SELECT (SELECT count(*) FROM workspaces), (SELECT count(*) FROM workspace_chats), (SELECT count(*) FROM workspace_documents), (SELECT count(*) FROM workspace_chats WHERE "feedbackScore" = true);')"
          test "$POSTGRES_COUNTS" = "1,1,1,1"
          POINTS_COUNT="$(curl -fsS http://localhost:6333/collections/smoke_collection | jq -r '.result.points_count')"
          test "$POINTS_COUNT" = "1"
          test -f "$STORAGE_DIR/documents/smoke.txt"
          {
            echo "Backup and restore drill: PASS"
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Archive: ${BACKUP_FILE}"
            echo "Postgres counts: ${POSTGRES_COUNTS}"
            echo "Qdrant points: ${POINTS_COUNT}"
            echo "Storage file: restored"
          } > "$GITHUB_WORKSPACE/backup-restore-report.txt"

      - name: Run ShellCheck
        run: shellcheck docker/scripts/backup.sh docker/scripts/restore.sh docker/scripts/test-backup-restore.sh

      - name: Upload restore drill report
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-drill-report
          path: ${{ env.GITHUB_WORKSPACE }}/backup-restore-report.txt
          if-no-files-found: error
